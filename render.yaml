services:
  - type: web
    name: ai-local-growth-machine
    runtime: ruby
    # Migrations run at START TIME (not build time) so the runtime container
    # can connect to Supabase. Render's build environment resolves the DB host
    # to an IPv6 address that its build network cannot reach.
    buildCommand: bundle install && bundle exec rails tailwindcss:build && bundle exec rails assets:precompile
    startCommand: bundle exec rails db:migrate && bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: WEB_CONCURRENCY
        value: "1"
