databases:
  - name: ai-local-growth-machine-db
    plan: free
    databaseName: growth_machine_production
    user: growth_machine

services:
  - type: web
    name: ai-local-growth-machine-docker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Run migrations before new version goes live (zero-downtime)
    preDeployCommand: bundle exec rails db:migrate
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-local-growth-machine-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: WEB_CONCURRENCY
        value: "1"
